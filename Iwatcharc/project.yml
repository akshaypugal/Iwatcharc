# WristBox - XcodeGen project definition.
#
# The .xcodeproj is generated, not committed. On a Mac:
#     bash scripts/bootstrap.sh        # installs XcodeGen (Homebrew) and generates WristBox.xcodeproj
#     open WristBox.xcodeproj
#
# Set your signing team and a unique bundle id once in Config/Local.xcconfig
# (copy Config/Local.xcconfig.example). Everything else works out of the box.

name: WristBox

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
    watchOS: "9.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  developmentLanguage: en
  xcodeVersion: "15.0"

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  WristBoxCore:
    path: Packages/WristBoxCore

targets:
  # ---------------------------------------------------------------- iPhone
  WristBox:
    type: application
    platform: iOS
    sources:
      - path: iPhone
    dependencies:
      - package: WristBoxCore
      - target: WristBoxWatch
    entitlements:
      path: iPhone/WristBox.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: iPhone/Info.plist
      properties:
        CFBundleDisplayName: WristBox
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSHealthShareUsageDescription: WristBox opens the Watch app so your Apple Watch can act as the boxing controller.
        NSHealthUpdateUsageDescription: WristBox opens the Watch app so your Apple Watch can act as the boxing controller.
        NSMotionUsageDescription: WristBox uses motion data from your Apple Watch to detect punches.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - WristBoxTests

  # ----------------------------------------------------------------- Watch
  WristBoxWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
    dependencies:
      - package: WristBoxCore
    entitlements:
      path: Watch/WristBoxWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: WristBox
        WKApplication: true
        WKCompanionAppBundleIdentifier: $(APP_BUNDLE_ID)
        WKRunsIndependentlyOfCompanionApp: false
        WKBackgroundModes:
          - workout-processing
        NSHealthShareUsageDescription: WristBox runs a boxing workout session so your Watch keeps tracking your punches while your wrist moves.
        NSHealthUpdateUsageDescription: WristBox runs a boxing workout session so your Watch keeps tracking your punches while your wrist moves.
        NSMotionUsageDescription: WristBox reads your wrist motion to detect punches, dodges and blocks.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).watchkitapp
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor

  # ----------------------------------------------------------------- Tests
  WristBoxTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: iPhoneTests
    dependencies:
      - target: WristBox
      - package: WristBoxCore
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
